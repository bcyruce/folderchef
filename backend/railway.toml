# ============================================================
# Railway Deployment Configuration — Backend
# ============================================================
# This file tells Railway how to build and deploy the backend.
# Docs: https://docs.railway.app/reference/config-as-code
#
# TWO WAYS TO RUN THE SCRAPER:
#
#   1. CRON (automatic):
#      Create a second Railway service in the same project,
#      point it at this same repo/backend folder, and set its
#      start command to:
#        python -m app.cli scrape
#      Then add a cron schedule in the Railway dashboard:
#        0 6 * * 1    (every Monday at 06:00 UTC)
#
#   2. MANUAL (one-off):
#      In the Railway dashboard, open a shell on any service
#      and run:
#        python -m app.cli scrape --week 6 --year 2026
#
# ============================================================

[build]
builder = "NIXPACKS"             # Auto-detects Python and installs deps

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE" # Restart automatically if the app crashes
restartPolicyMaxRetries = 3      # Max 3 restart attempts
# NOTE: healthcheckPath is NOT set here because this toml is shared by
# both the web service and the cron service. Set the healthcheck to
# /api/health in the Railway dashboard for the web service only.
