# ============================================================
# Railway Deployment Configuration — Backend
# ============================================================
# This file tells Railway how to build and deploy the backend.
# Docs: https://docs.railway.app/reference/config-as-code
# ============================================================

[build]
builder = "NIXPACKS"             # Auto-detects Python and installs deps

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/api/health"  # Railway pings this to check if app is alive
restartPolicyType = "ON_FAILURE" # Restart automatically if the app crashes
restartPolicyMaxRetries = 3      # Max 3 restart attempts
